name: Publish GHCR image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publication across every dispatch ref so latest is not raced.
concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Resolve image name and source commit
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish main
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Path context is required: the default Git context uses the dispatch ref.
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Published image: $IMAGE:latest"
            echo "Commit tag: $IMAGE:sha-$SOURCE_SHA"
            echo "Digest: $IMAGE@$DIGEST"
            echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
